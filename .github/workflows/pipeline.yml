name: Pipeline
on: [push]

jobs:

# LINT
  black:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: python3.9 -m pip install -r .github/workflows/requirements-lint.txt
      - run: python3.9 -m pip install -U typing-extensions~=3.10.0.0
      - run: python3.9 -m black --version
      - run: python3.9 -m black ./ --check --diff --color --preview
  isort:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: python3.9 -m pip install -r .github/workflows/requirements-lint.txt
      - run: python3.9 -m isort --version
      - run: python3.9 -m isort --check --diff ./
  flake8:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: python3.9 --version
      - run: python3.9 -m pip install -r .github/workflows/requirements-lint.txt
      - run: python3.9 -m flake8 --version
      - run: python3.9 -m flake8 ./

# TEST
  pytest:
    needs: [black, isort, flake8]
    runs-on: self-hosted
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: python -m pip install --upgrade pip

      - name: Run tests
        run: python3.9 -m pip install -r .github/workflows/requirements-test.tx
        run: pytest

    